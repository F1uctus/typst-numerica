name: Render Typst Documents

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes any in-flight run for the same ref; without this,
# the older run's README push races the new commit and fails as non-fast-forward.
concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      worksheets: ${{ steps.list.outputs.worksheets }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          find worksheets -name '*.typ' -type f | sort |
            jq -R -s -c 'split("\n") | map(select(length > 0))' |
            sed 's/^/worksheets=/' >> "$GITHUB_OUTPUT"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4
      - name: Run library tests
        run: |
          find tests -name "*.typ" -type f | while read -r file; do
            typst compile "$file" - --format pdf --root . --package-path packages > /dev/null
          done

  # One action call per worksheet: the action renders a single document, so the
  # fan-out lives here, where ordering and grouping are decided.
  render:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        file: ${{ fromJson(needs.discover.outputs.worksheets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: typst-community/setup-typst@v4

      - name: Compile PDF
        run: typst compile "${{ matrix.file }}" --root . --package-path packages

      - id: preview
        uses: F1uctus/typst-readme-preview@v2
        with:
          file: ${{ matrix.file }}
          title-label: preview-title
          open-depth: 1
          media: prefers-color-scheme=light,dark
          base-url: https://raw.githubusercontent.com/${{ github.repository }}/previews
          typst-args: --root . --package-path packages

      - name: Name the fragment after its path
        run: |
          slug=$(echo '${{ matrix.file }}' | sed 's|/|_|g; s|\.typ$||')
          mv previews/preview.md "previews/$slug.md"

      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ strategy.job-index }}
          path: |
            previews/*.svg
            previews/*.md
            worksheets/**/*.pdf
          retention-days: 1

  publish:
    needs: [render, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: preview-*
          path: fragments
          merge-multiple: true

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.run_id }}
          path: fragments/worksheets/**/*.pdf
          retention-days: 7

      # Release assets are served as application/octet-stream, which browsers
      # refuse to render as SVG; raw.githubusercontent.com sets image/svg+xml.
      - name: Publish previews branch
        run: |
          mkdir -p out && cp fragments/previews/*.svg out/
          cd out
          git init -q -b previews
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add '*.svg'
          git commit -qm "Previews for ${{ github.sha }}"
          git push -qf "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git" previews

      # Fragments are named after their path, so sorting them restores document
      # order and the directory headings the README carried before.
      - name: Splice README
        run: |
          python3 - <<'EOF'
          from pathlib import Path

          section, group = [], None
          for md in sorted(Path("fragments/previews").glob("*.md")):
              directory = md.stem.rsplit("_", 1)[0].replace("_", "/")
              if directory != group:
                  section.append(f"### {directory}\n")
                  group = directory
              section.append(md.read_text(encoding="utf-8").strip() + "\n")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          a = text.index("<!-- preview:begin -->") + len("<!-- preview:begin -->")
          b = text.index("<!-- preview:end -->")
          body = "\n".join(section).strip()
          readme.write_text(f"{text[:a]}\n\n{body}\n\n{text[b:]}", encoding="utf-8")
          EOF

      - name: Commit README
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "${{ github.sha }}" ]; then
            echo "main moved past ${{ github.sha }}; the newer run will refresh the README"
            exit 0
          fi
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged"
            exit 0
          fi
          git commit -qm "Update README preview"
          git push -q "https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.git" HEAD:main
